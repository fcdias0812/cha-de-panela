# Teste automático: roda a cada Pull Request.
# Confere duas coisas: (1) o teste do backend passa; (2) o site inteiro sobe
# dentro do container e responde. Se qualquer uma falhar, o PR é reprovado.
name: Teste do sistema

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instala e testa o backend
        working-directory: backend
        env:
          DATABASE_URL: "file:./test.db"
        run: |
          npm install
          npx prisma generate
          npm test

      - name: Confere que o ponto de entrada do Vercel carrega
        env:
          DATABASE_URL: "file:./test.db"
        run: |
          node -e "
          const app = require('./api/index.js');
          if (typeof app !== 'function') { throw new Error('api/index.js nao exportou o app do Express'); }
          const s = app.listen(0, async () => {
            const r = await fetch('http://localhost:' + s.address().port + '/api/health');
            if (r.status !== 200) { throw new Error('health check do Vercel respondeu ' + r.status); }
            console.log('ponto de entrada do Vercel: ok');
            s.close();
          });
          "

      - name: Confere que o site sobe (build + health check)
        run: |
          docker build -t cha-teste .
          docker run -d --name cha -e PORT=3000 -e DATABASE_URL=file:/app/data/app.db -p 3000:3000 cha-teste
          sleep 12
          curl --fail http://localhost:3000/api/health || (docker logs cha && exit 1)
          docker rm -f cha
